# RabbitMQ topology draft for HLRMS
virtual_host: /hlrms

exchanges:
  - name: hlrms.requests.exchange
    type: topic
    durable: true
  - name: hlrms.retry.exchange
    type: direct
    durable: true
  - name: hlrms.dlx.exchange
    type: direct
    durable: true

queues:
  - name: hlrms.requests.high.q
    durable: true
    type: quorum
    binding:
      exchange: hlrms.requests.exchange
      routing_key: request.high
  - name: hlrms.requests.normal.q
    durable: true
    type: quorum
    binding:
      exchange: hlrms.requests.exchange
      routing_key: request.normal
  - name: hlrms.requests.low.q
    durable: true
    type: quorum
    binding:
      exchange: hlrms.requests.exchange
      routing_key: request.low
  - name: hlrms.retry.q
    durable: true
    type: quorum
    arguments:
      x-message-ttl: 30000
      x-dead-letter-exchange: hlrms.requests.exchange
      x-dead-letter-routing-key: request.normal
    binding:
      exchange: hlrms.retry.exchange
      routing_key: retry.delay
  - name: hlrms.dlq
    durable: true
    type: quorum
    binding:
      exchange: hlrms.dlx.exchange
      routing_key: request.dead

publishing:
  delivery_mode: persistent
  publisher_confirms: true
  mandatory: true

consuming:
  acknowledgement: manual
  prefetch_count: 20
  requeue_unclassified_failures: false
