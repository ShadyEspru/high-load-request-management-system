groups:
  - name: hlrms-alerts
    rules:
      - alert: HighRequestFailureRate
        expr: |
          sum(rate(hlrms_requests_failed_total[5m]))
          /
          clamp_min(sum(rate(hlrms_requests_received_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HLRMS request failure rate is above 5%"

      - alert: QueueBacklogGrowing
        expr: rabbitmq_queue_messages_ready > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog is high"

      - alert: NoActiveWorkers
        expr: hlrms_active_workers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No active worker is available"

      - alert: DLQMessagesDetected
        expr: increase(hlrms_dlq_messages_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "New messages were moved to the DLQ"

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A monitored HLRMS component is down"
