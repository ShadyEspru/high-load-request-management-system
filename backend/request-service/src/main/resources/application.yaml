spring:
  application:
    name: request-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hlrms_requests}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hlrms}
    password: ${RABBITMQ_PASSWORD:hlrms_password}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
        max-attempts: 3

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always