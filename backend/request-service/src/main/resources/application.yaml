spring:
  application:
    name: request-service

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hlrms_requests}
    username: ${DB_USERNAME:hlrms}
    password: ${DB_PASSWORD:hlrms_password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hlrms_redis_password}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hlrms}
    password: ${RABBITMQ_PASSWORD:hlrms_password}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
        max-attempts: 3

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        "{http.server.requests}": true

      slo:
        "{http.server.requests}":
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
          - 5s

hlrms:
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    initial-delay: ${OUTBOX_INITIAL_DELAY:2000}
    fixed-delay: ${OUTBOX_FIXED_DELAY:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

  redis:
    idempotency-key-prefix: ${REDIS_IDEMPOTENCY_KEY_PREFIX:hlrms:idempotency:}
    lock-key-prefix: ${REDIS_LOCK_KEY_PREFIX:hlrms:lock:idempotency:}
    request-cache-key-prefix: ${REDIS_REQUEST_CACHE_KEY_PREFIX:hlrms:cache:request:}

    idempotency-ttl: ${REDIS_IDEMPOTENCY_TTL:24h}
    lock-ttl: ${REDIS_LOCK_TTL:10s}
    request-cache-ttl: ${REDIS_REQUEST_CACHE_TTL:30m}
    lock-wait-timeout: ${REDIS_LOCK_WAIT_TIMEOUT:2s}
    lock-retry-interval: ${REDIS_LOCK_RETRY_INTERVAL:50ms}