spring:
  application:
    name: request-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hlrms_requests}
    username: ${DB_USERNAME:hlrms}
    password: ${DB_PASSWORD:hlrms_password}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hlrms}
    password: ${RABBITMQ_PASSWORD:hlrms_password}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
        max-attempts: 3

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

hlrms:
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    initial-delay: ${OUTBOX_INITIAL_DELAY:2000}
    fixed-delay: ${OUTBOX_FIXED_DELAY:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}