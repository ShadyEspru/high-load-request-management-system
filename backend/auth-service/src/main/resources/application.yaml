spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/hlrms_auth}
    username: ${AUTH_DB_USERNAME:hlrms}
    password: ${AUTH_DB_PASSWORD:hlrms_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.hlrms.authservice: INFO

jwt:
  issuer: hlrms-auth-service

  secret: ${JWT_SECRET:ReplaceThisWithAVeryLongRandomSecretKeyAtLeast32Characters}

  access-token-expiration: 15m

  refresh-token-expiration: 30d