global
    maxconn 20000
    stats socket ipv4@0.0.0.0:9998 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    retries 1
    option redispatch

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend api_gateway_frontend
    bind *:8088
    default_backend api_gateway_backend

backend api_gateway_backend
    balance roundrobin

    option httpchk GET /actuator/health
    http-check expect status 200

    server gw1 high-load-request-management-system-api-gateway-1:8088 check inter 2s fall 3 rise 2 resolvers docker init-addr libc,none maxconn 1200
