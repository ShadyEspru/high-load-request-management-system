global
    maxconn 20000
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    retries 1
    option redispatch

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend request_service_frontend
    bind *:8080
    default_backend request_service_backend

backend request_service_backend
    balance roundrobin

    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    server rs1 high-load-request-management-system-request-service-1:8080 check inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
    server rs2 high-load-request-management-system-request-service-2:8080 check inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
