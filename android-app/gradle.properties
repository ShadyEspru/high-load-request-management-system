# Project-wide Gradle settings.

# Gradle JVM
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Limit concurrent Gradle workers to reduce memory pressure
org.gradle.workers.max=2

# Compile Kotlin inside the Gradle process instead of a separate Kotlin daemon
kotlin.compiler.execution.strategy=in-process

# Kotlin code style
kotlin.code.style=official

# Configuration cache
org.gradle.configuration-cache=true