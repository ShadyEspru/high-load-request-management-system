spring:
  application:
    name: transfer-api

  datasource:
    url: ${TRANSFER_DB_URL:jdbc:postgresql://localhost:5432/hlrms_transfer}
    username: ${TRANSFER_DB_USERNAME:hlrms}
    password: ${TRANSFER_DB_PASSWORD:hlrms_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

jwt:
  issuer: ${JWT_ISSUER:hlrms-auth-service}
  secret: ${JWT_SECRET:ReplaceThisWithAVeryLongRandomSecretKeyAtLeast32Characters}